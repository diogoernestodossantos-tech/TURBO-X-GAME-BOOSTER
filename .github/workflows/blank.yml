name: Gerar APK TURBO X

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o TURBO-X-PROJETO.zip -d projeto
          GRADLEW_PATH=$(find projeto -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERRO: gradlew não encontrado no ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: TURBO-X-GAME-BOOSTER
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
